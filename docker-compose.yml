version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vilo_postgres_18
    restart: always
    environment:
      POSTGRES_DB: vilo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - vilo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vilo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vilo_postgres_data:
    driver: local
